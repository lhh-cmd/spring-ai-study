spring.application.name=spring-ai-study-service

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/moyoo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus配置
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.ai.haha.springaistudyservice.service.moyoo.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=assign_id
mybatis-plus.global-config.db-config.table-underline=true

# Spring AI OpenAI 配置
spring.ai.openai.api-key=${OPENAI_API_KEY:your-api-key-here}
spring.ai.openai.chat.options.model=gpt-3.5-turbo
spring.ai.openai.chat.options.temperature=0.7

# CVM 代码版本管理系统配置
cvm.workspace.dir=${CVM_WORKSPACE:./cvm-workspace}
cvm.git.username=${CVM_GIT_USERNAME:}
cvm.git.token=${CVM_GIT_TOKEN:}
cvm.git.master-branch=master
